<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Vi deltar på Plastdugnaden 2026 – bli med og rydde plast fra naturen!">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#90e0ef;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#caf0f8;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48cae4;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#90e0ef;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12" ry="12"/>

  <!-- Decorative waves -->
  <path d="M0 140 Q100 120 200 140 Q300 160 400 140 Q500 120 600 140 Q700 160 800 140 L800 200 L0 200 Z" fill="url(#wave1)"/>
  <path d="M0 160 Q120 140 240 160 Q360 180 480 160 Q600 140 720 160 L800 165 L800 200 L0 200 Z" fill="url(#wave2)"/>

  <!-- Leaf / nature icon on the left -->
  <g transform="translate(50, 60)">
    <circle cx="40" cy="40" r="38" fill="rgba(255,255,255,0.15)"/>
    <!-- Recycle arrows -->
    <path d="M40 12 L50 28 L44 28 L44 52 Q44 60 36 60 L28 60 L28 54 Q32 54 32 50 L32 28 L26 28 Z" fill="#90e0ef"/>
    <path d="M62 48 L46 40 L52 36 Q58 18 40 12 L54 6 Q76 14 74 44 Z" fill="#caf0f8" opacity="0.8"/>
    <path d="M18 48 L34 40 L28 36 Q22 18 40 12 L26 6 Q4 14 6 44 Z" fill="#caf0f8" opacity="0.8"/>
  </g>

  <!-- Main text -->
  <text x="160" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="rgba(255,255,255,0.9)" letter-spacing="2">1. DRAMMEN SPEIDERGRUPPE</text>
  <text x="160" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Vi deltar på Plastdugnaden 2026!</text>
  <text x="160" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#caf0f8">Bli med og rydd plast fra naturen – sammen gjør vi en forskjell</text>

  <!-- Right badge -->
  <g transform="translate(680, 65)">
    <circle cx="40" cy="40" r="38" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <text x="40" y="34" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">HOLD</text>
    <text x="40" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">NORGE</text>
    <text x="40" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">RENT</text>
  </g>
</svg>
